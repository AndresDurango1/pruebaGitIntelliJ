<div class="container">
  <div class="row">
    <div class="col">
      <h1>Emprendimientos</h1>
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Nombre</th>
            <th scope="col">Descripción</th>
            <th scope="col">Fecha de Creación</th>
            <th scope="col">Fecha de Actualización</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor = "let emprendimiento of emprendimientos">
            <th scope="row">{{emprendimiento.id}}</th>
            <td>{{emprendimiento.nombre}}</td>
            <td>{{emprendimiento.descripcion}}</td>
            <td>{{emprendimiento.fecha_creacion}}</td>
            <td>{{emprendimiento.fecha_actualizacion}}</td>
            <td>
              <button class="btn btn-primary">Editar</button>
              <button class="btn btn-danger">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
      <button btn class="btn btn-success" [routerLink]="['/crear-emprendimiento']">Crear Emprendimiento</button>
    </div>
  </div>
</div>
