<div class="container">
  <div class="row">
    <div class="col">
      <h1>Publicaciones</h1>
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Titulo</th>
            <th scope="col">Descripción</th>
            <th scope="col">Fecha de Creación</th>
            <th scope="col">Fecha de Actualización</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor = "let publicacion of publicaciones">
            <th scope="row">{{publicacion.id}}</th>
            <td>{{publicacion.titulo}}</td>
            <td>{{publicacion.descripcion}}</td>
            <td>{{publicacion.fecha_creacion}}</td>
            <td>{{publicacion.fecha_actualizacion}}</td>
            <td>
              <button class="btn btn-primary">Editar</button>
              <button class="btn btn-danger">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
      <button btn class="btn btn-success" [routerLink]="['/crear-publicacion']">Crear Publicacion</button>
    </div>
  </div>
</div>
